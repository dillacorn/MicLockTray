name: Finalize verified MicLockTray v2.0 draft

# Recovery runs from the already-used feature branch, NOT from main.
# The completed v2.0 draft and assets are never recreated or replaced.
on:
  push:
    branches:
      - agent/multi-mic-persistent-locks
    paths:
      - '.github/workflows/release-v2.yml'

permissions:
  contents: write

concurrency:
  group: miclocktray-release-v2.0
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'dillacorn/MicLockTray'
    runs-on: ubuntu-latest

    steps:
      - name: Verify original main commit and existing draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main" = '564ecbfc98bbae41a47c48d91e6f4517992e7d35'
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/423797436")"
          printf '%s\n' "$release" | jq -e '
            .id == 423797436
            and .draft == true
            and .tag_name == "v2.0"
            and .name == "MicLockTray v2.0"
            and .target_commitish == "564ecbfc98bbae41a47c48d91e6f4517992e7d35"
            and .prerelease == false
            and ([.assets[] | select(
              .name == "MicLockTray.exe"
              and .size == 153946923
              and .state == "uploaded"
              and .digest == "sha256:ad21875800cb5a8081f9b810b2b54adffce08b66d1eba0fe8d15d8a81544cf9c"
            )] | length) == 1
            and ([.assets[] | select(
              .name == "MicLockTray.exe.sha256"
              and .size == 83
              and .state == "uploaded"
              and .digest == "sha256:7d401fd98355c1eb46769c5e0e468cbadfe00e4251aafc6ebb371c6ab276983a"
            )] | length) == 1
            and (.assets | length) == 2
          ' >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0" >/dev/null 2>&1; then
            echo "::error::v2.0 tag already exists; refusing to move it"
            false
          fi
          echo "Verified existing draft release, exact main commit, asset sizes and SHA256 digests."

      - name: Publish verified existing draft by release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/423797436" \
            -F draft=false -f make_latest=true --jq '{id, tag_name, draft, html_url}'
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/423797436")"
          printf '%s\n' "$release" | jq -e '
            .id == 423797436
            and .draft == false
            and .tag_name == "v2.0"
            and .prerelease == false
            and ([.assets[] | select(
              .name == "MicLockTray.exe"
              and .digest == "sha256:ad21875800cb5a8081f9b810b2b54adffce08b66d1eba0fe8d15d8a81544cf9c"
            )] | length) == 1
          ' >/dev/null
          tagsha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0" --jq '.object.sha')"
          test "$tagsha" = '564ecbfc98bbae41a47c48d91e6f4517992e7d35'
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$latest" = 'v2.0'
          echo 'v2.0 published. Tag, assets and latest-release state verified.'
