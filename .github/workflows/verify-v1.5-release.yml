name: verify-v1.5-release

on:
  push:
    branches:
      - testing
    paths:
      - '.github/workflows/verify-v1.5-release.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Record v1.5 release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view v1.5 `
            --repo $env:GITHUB_REPOSITORY `
            --json url,tagName,name,isLatest,targetCommitish,body,assets

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read release v1.5.'
          }

          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          gh api `
            --method PUT `
            "repos/$env:GITHUB_REPOSITORY/contents/.github/releases/v1.5-verification.json" `
            -f message='Record v1.5 release metadata' `
            -f content="$encoded" `
            -f branch='testing'

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to record v1.5 release metadata.'
          }
