name: testing-exe

on:
  push:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-testing-exe:
    runs-on: windows-latest

    steps:
      - name: Check out testing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish testing executable
        run: >-
          dotnet publish MicLockTray/MicLockTray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish

      - name: Verify EXE-only output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'MicLockTray.exe') {
            $names = ($files | ForEach-Object Name) -join ', '
            throw "Expected only MicLockTray.exe, found: $names"
          }

      - name: Upload MicLockTray.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: publish/MicLockTray.exe
          if-no-files-found: error
          retention-days: 14
          archive: false
